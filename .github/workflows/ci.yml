name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore MRTDScope.slnx

      - name: Format check
        run: dotnet format MRTDScope.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build MRTDScope.slnx --configuration Release --no-restore

      # The suite must pass with no reader, no chip, and no network (NFR2).
      # Hardware-dependent tests are trait-gated and skipped here by design.
      - name: Test
        run: >
          dotnet test MRTDScope.slnx
          --configuration Release
          --no-build
          --filter "Category!=Hardware"
          --logger "trx;LogFileName=test-results.trx"
